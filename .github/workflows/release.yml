name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag in vX.Y.Z format
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.tag }}'
          } else {
            '${{ github.ref_name }}'
          }

          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Tag '$tag' must use the vX.Y.Z format."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run self-tests
        shell: pwsh
        run: dotnet run --project .\Tests\QuotaWisp.SelfTest.csproj --configuration Release

      - name: Build portable ZIP
        shell: pwsh
        run: .\build-portable.ps1 -Version '${{ steps.release.outputs.version }}'

      - name: Write checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\artifacts\QuotaWisp-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  QuotaWisp-win-x64.zip" | Set-Content .\artifacts\QuotaWisp-win-x64.zip.sha256 -Encoding ascii

      - name: Create or update GitHub Release
        shell: pwsh
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $version = '${{ steps.release.outputs.version }}'
          $assets = @(
            '.\artifacts\QuotaWisp-win-x64.zip',
            '.\artifacts\QuotaWisp-win-x64.zip.sha256'
          )

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not replace release assets.' }
            gh release edit $tag --latest
          } else {
            gh release create $tag @assets --verify-tag --generate-notes --latest --title "Quota Wisp $version"
          }

          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the GitHub Release.' }
